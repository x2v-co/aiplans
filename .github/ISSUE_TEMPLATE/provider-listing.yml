name: Provider listing or data source
description: Share a machine-readable pricing/model data source, or ask aiplans.dev to add or update a provider
title: "Provider listing: <provider name>"
labels: ["provider-listing", "data"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep aiplans.dev accurate.

        Preferred path: give us a machine-readable source we can ingest and keep updated automatically.
        If you do not have one, use the manual fields below as a fallback.

  - type: input
    id: provider_name
    attributes:
      label: Provider name
      placeholder: "Example: ExampleAPI"
    validations:
      required: true

  - type: input
    id: website_url
    attributes:
      label: Website URL
      placeholder: "https://example.com"
    validations:
      required: true

  - type: textarea
    id: machine_readable_source
    attributes:
      label: Machine-readable data source, preferred
      description: Pricing/model API, public JSON, OpenAPI spec, docs endpoint, status endpoint, or a stable pricing page we can scrape. Include auth/rate-limit notes if needed.
      placeholder: |
        Models API: https://api.example.com/v1/models
        Pricing API / JSON: https://example.com/pricing.json
        Docs: https://docs.example.com/pricing
        Auth required: no / yes, contact us for key
        Update frequency: real-time / daily / manual
    validations:
      required: true

  - type: input
    id: registration_url
    attributes:
      label: Registration or invite URL
      description: Optional. Use your preferred tracking or campaign URL if you have one.
      placeholder: "https://example.com/register?ref=aiplans"

  - type: textarea
    id: manual_fallback
    attributes:
      label: Manual fallback, only if no API/data source exists
      description: Optional. Fill this only if the machine-readable source above cannot expose all details.
      placeholder: |
        Supported models:
        - claude-sonnet-4-6
        - gpt-5.6

        Pricing:
        Currency: USD
        gpt-5.6: input $x / 1M, output $y / 1M

        Billing:
        Minimum top-up:
        Payment methods:

        Region / China access:

  - type: textarea
    id: contact
    attributes:
      label: Official contact
      description: Email, Telegram, Discord, QQ group, WeChat, or a contact page for future pricing/model verification.
      placeholder: "support@example.com"
    validations:
      required: true

  - type: textarea
    id: exclusive_offer
    attributes:
      label: Exclusive offer for aiplans.dev users
      description: Optional. We can display verified offers on provider pages and the deals section.
      placeholder: |
        Coupon code: AIPLANS
        Offer: 10% off first top-up / $3 free credit / enterprise discount
        Terms: new users only, expires ..., regions ...

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I confirm the submitted information can be listed publicly on aiplans.dev, unless marked as private integration notes.
          required: true
