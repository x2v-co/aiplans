name: Scrape Pricing Data

on:
  # Production scheduling is owned by planprice-scraper.timer on devbox.
  workflow_dispatch: # Allow manual recovery runs only.

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API price scrapers
        id: api-scrape
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run scrape

      - name: Run subscription plan scrapers
        id: plan-scrape
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run scrape:plans

      - name: Fail if a scraper group failed
        if: steps.api-scrape.outcome == 'failure' || steps.plan-scrape.outcome == 'failure'
        run: |
          echo "API scrape: ${{ steps.api-scrape.outcome }}"
          echo "Plan scrape: ${{ steps.plan-scrape.outcome }}"
          exit 1

      - name: Upload logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_number }}
          path: |
            *.log
            scrape-*.json
          retention-days: 7
