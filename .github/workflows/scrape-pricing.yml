name: Scrape Pricing Data

on:
  # Production scheduling is owned by planprice-scraper.timer on devbox.
  # This dispatch is a manual recovery trigger that runs the same script as
  # the timer, on the production host inside the compose network.
  workflow_dispatch:
    inputs:
      skip_api:
        description: 'Skip API scrapers and refresh subscription plan mappings only'
        required: false
        default: false
        type: boolean
      benchmarks_only:
        description: 'Only refresh task benchmark scores'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  scrape:
    if: ${{ !inputs.benchmarks_only }}
    runs-on: [self-hosted, planprice-production]
    timeout-minutes: 45
    environment: Production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/x2v/planprice' }}
      SKIP_API: ${{ inputs.skip_api && '1' || '0' }}

    steps:
      - name: Run scraper chain on devbox
        run: |
          set -euo pipefail
          base="$DEPLOY_PATH"
          test -d "$base"
          sudo -n test -r "$base/deploy/production/.env.production"

          # Share the timer's lock so a manual run never overlaps nightly work.
          exec 9<"$base"
          flock -w 1800 9

          exec sudo -n env \
            DOCKER_CMD=/usr/bin/docker \
            LOCK_PATH="$base" \
            SKIP_API="$SKIP_API" \
            "$base/deploy/production/run-scrapers.sh"

  benchmark:
    if: ${{ inputs.benchmarks_only }}
    runs-on: [self-hosted, planprice-production]
    timeout-minutes: 15
    environment: Production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/x2v/planprice' }}

    steps:
      - name: Refresh task benchmark scores
        run: |
          set -euo pipefail
          base="$DEPLOY_PATH"
          compose_file="$base/deploy/production/compose.yml"
          env_file="$base/deploy/production/.env.production"

          test -d "$base"
          sudo -n test -r "$env_file"

          exec 9<"$base"
          flock -w 1800 9

          sudo -n docker compose -p planprice-production \
            -f "$compose_file" \
            --env-file "$env_file" \
            run --rm scraper npm run ingest:benchmarks

      - name: Report benchmark coverage
        run: |
          set -euo pipefail
          base="$DEPLOY_PATH"
          compose_file="$base/deploy/production/compose.yml"
          env_file="$base/deploy/production/.env.production"
          sudo -n docker compose -p planprice-production \
            -f "$compose_file" \
            --env-file "$env_file" \
            exec -T postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -P pager=off' <<'SQL'
          SELECT b.slug, COUNT(DISTINCT s.model_id) AS models, COUNT(*) AS scores
          FROM benchmarks b
          JOIN benchmark_versions v ON v.benchmark_id = b.id AND v.is_current = true
          JOIN benchmark_tasks t ON t.benchmark_version_id = v.id
          JOIN model_benchmark_scores s ON s.benchmark_task_id = t.id
          WHERE b.slug IN (
            'gpqa-diamond', 'humanitys-last-exam', 'scicode',
            'terminal-bench-hard', 'ifbench', 'mmmu-pro'
          )
          GROUP BY b.slug
          ORDER BY b.slug;
          SQL
