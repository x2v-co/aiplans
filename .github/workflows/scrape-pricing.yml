name: Scrape Pricing Data

on:
  # Production scheduling is owned by planprice-scraper.timer on devbox.
  workflow_dispatch:
    inputs:
      skip_api:
        description: 'Skip API scrapers and refresh subscription plan mappings only'
        required: false
        default: false
        type: boolean
      benchmarks_only:
        description: 'Only refresh task benchmark scores'
        required: false
        default: false
        type: boolean

jobs:
  scrape:
    if: ${{ !inputs.benchmarks_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API price scrapers
        id: api-scrape
        continue-on-error: true
        if: ${{ !inputs.skip_api && !inputs.benchmarks_only }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run scrape

      - name: Run subscription plan scrapers
        id: plan-scrape
        continue-on-error: true
        if: ${{ !inputs.benchmarks_only }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run scrape:plans

      - name: Refresh plan classifications
        id: plan-kinds
        continue-on-error: true
        if: ${{ !inputs.benchmarks_only }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run fix:kinds

      - name: Materialize model plan mappings
        id: plan-mappings
        if: ${{ !inputs.benchmarks_only }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run mappings:materialize

      - name: Fail if a scraper group or mapping refresh failed
        if: >-
          steps.api-scrape.outcome == 'failure' ||
          steps.plan-scrape.outcome == 'failure' ||
          steps.plan-mappings.outcome == 'failure'
        run: |
          echo "API scrape: ${{ steps.api-scrape.outcome }}"
          echo "Plan scrape: ${{ steps.plan-scrape.outcome }}"
          echo "Plan kind refresh: ${{ steps.plan-kinds.outcome }}"
          echo "Plan mapping refresh: ${{ steps.plan-mappings.outcome }}"
          exit 1

      - name: Upload logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_number }}
          path: |
            *.log
            scrape-*.json
          retention-days: 7

  benchmark:
    if: ${{ inputs.benchmarks_only }}
    runs-on: [self-hosted, planprice-production]
    timeout-minutes: 15
    environment: Production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/x2v/planprice' }}

    steps:
      - name: Refresh task benchmark scores
        run: |
          set -euo pipefail
          base="$DEPLOY_PATH"
          compose_file="$base/deploy/production/compose.yml"
          env_file="$base/deploy/production/.env.production"

          test -d "$base"
          sudo -n test -r "$env_file"
          exec 9<"$base"
          flock -w 1800 9

          sudo -n docker compose -p planprice-production \
            -f "$compose_file" \
            --env-file "$env_file" \
            run --rm scraper npm run ingest:benchmarks

      - name: Report benchmark coverage
        run: |
          set -euo pipefail
          base="$DEPLOY_PATH"
          sudo -n docker compose -p planprice-production \
            -f "$base/deploy/production/compose.yml" \
            --env-file "$base/deploy/production/.env.production" \
            exec -T postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -P pager=off' <<'SQL'
          SELECT b.slug, COUNT(DISTINCT s.model_id) AS models, COUNT(*) AS scores
          FROM benchmarks b
          JOIN benchmark_versions v ON v.benchmark_id = b.id AND v.is_current = true
          JOIN benchmark_tasks t ON t.benchmark_version_id = v.id
          JOIN model_benchmark_scores s ON s.benchmark_task_id = t.id
          WHERE b.slug IN (
            'gpqa-diamond', 'humanitys-last-exam', 'scicode',
            'terminal-bench-hard', 'ifbench', 'mmmu-pro'
          )
          GROUP BY b.slug
          ORDER BY b.slug;
          SQL
