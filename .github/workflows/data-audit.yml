name: Data Accuracy Audit

on:
  # Nightly auditing is owned by planprice-scraper.timer on devbox, which runs
  # the audit against the private production Postgres after every scrape
  # cycle. GitHub-hosted runners have no network path to that database.
  workflow_dispatch:   # manual audit on the production host
  pull_request:
    paths:
      - 'scripts/db/queries.ts'
      - 'scripts/scrapers/**'
      - 'scripts/audit-data.ts'
      - 'scripts/fix-data-audit.ts'
      - 'scripts/fix-plans-audit.ts'
      - 'src/db/schema/**'

permissions:
  contents: read

jobs:
  # DB-free gate for code review: scraper/schema changes must still compile.
  # Data correctness is enforced by the post-scrape audit on the VPS.
  typecheck:
    name: Type-check scripts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

  # Manual recovery/inspection run against production, inside the compose
  # network — no database credentials need to live in GitHub secrets.
  audit:
    name: Audit production data
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, planprice-production]
    timeout-minutes: 15
    environment: Production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/x2v/planprice' }}

    steps:
      - name: Run audit in scraper container
        run: |
          set -euo pipefail
          base="$DEPLOY_PATH"
          compose_file="$base/deploy/production/compose.yml"
          env_file="$base/deploy/production/.env.production"

          test -d "$base"
          sudo -n test -r "$env_file"
          exec 9<"$base"
          flock -w 1800 9

          set +e
          sudo -n docker compose -p planprice-production \
            -f "$compose_file" \
            --env-file "$env_file" \
            run --rm scraper npm run audit
          code=$?
          set -e

          # Exit codes: 0 clean, 1 critical findings (fail), 2 warnings only (pass)
          if [ "$code" = "1" ]; then
            echo "::error::Critical data-accuracy findings detected"
            exit 1
          fi
          if [ "$code" != "0" ] && [ "$code" != "2" ]; then
            echo "::error::Audit execution failed with exit code $code"
            exit "$code"
          fi
