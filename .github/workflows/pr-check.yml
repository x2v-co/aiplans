name: PR check

# Runs on every PR so the job context "Type-check, unit tests, build" always
# reports and can be a required status check on main. PRs that touch none of
# the code/workflow paths skip the heavy steps but the job still succeeds.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Type-check, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Real Postgres for seed/migration checks: the in-memory seed fake does not enforce CHECK
    # constraints (aiplans#303 apply failed in production on models_pricing_unit_chk).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          echo "Changed files:"; echo "$changed"
          if echo "$changed" | grep -qE '^(src|scripts|drizzle|messages|\.github/workflows)/|^package(-lock)?\.json$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No code/workflow paths changed; skipping type-check, tests and build." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: '22'
          cache: 'npm'
      - if: steps.changes.outputs.relevant == 'true'
        run: npm ci
      - name: Type-check
        if: steps.changes.outputs.relevant == 'true'
        run: npx tsc --noEmit
      - name: Quota schema type-check
        if: steps.changes.outputs.relevant == 'true'
        run: npx tsc --noEmit -p scripts/tsconfig.quota.json
      - name: Unit tests
        if: steps.changes.outputs.relevant == 'true'
        run: npm test
      - name: Postgres migrations and seed check
        if: steps.changes.outputs.relevant == 'true'
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
          ARGON_TEST_DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
        run: |
          set -euo pipefail
          npx drizzle-kit push --force
          npx tsx scripts/migrate-data-accuracy.ts
          # Deploy replays every migration; a second run must stay green.
          npx tsx scripts/migrate-data-accuracy.ts
          npm run test:db
      - name: Build
        if: steps.changes.outputs.relevant == 'true'
        run: npm run build
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:1/ci
