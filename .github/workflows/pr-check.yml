name: PR check

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'drizzle/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pr-check.yml'

permissions:
  contents: read

jobs:
  check:
    name: Type-check, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Quota schema type-check
        run: npx tsc --noEmit -p scripts/tsconfig.quota.json
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:1/ci
