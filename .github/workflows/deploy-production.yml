name: Deploy Planprice Production

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/data-audit.yml'
      - '.github/workflows/scrape-pricing.yml'
      - '.github/workflows/seed-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planprice-production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Verify release
    # Build/verify on the same self-hosted runner that deploys, so this release
    # check consumes no GitHub-hosted (billable) minutes.
    runs-on: [self-hosted, planprice-production]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Audit vertical catalog
        run: npm run audit:verticals

      - name: Build production bundle
        env:
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
        run: npm run build

  deploy:
    name: Deploy to devbox
    needs: verify
    runs-on: [self-hosted, planprice-production]
    timeout-minutes: 25
    environment: Production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/x2v/planprice' }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure protected API credentials
        env:
          PLANPRICE_CATALOG_TOKEN: ${{ secrets.PLANPRICE_CATALOG_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PLANPRICE_CATALOG_TOKEN"
          test "${#PLANPRICE_CATALOG_TOKEN}" -ge 32
          env_file="$DEPLOY_PATH/deploy/production/.env.production"
          sudo -n test -f "$env_file"
          # Replace only the protected settings. The token is supplied through
          # the GitHub Environment secret and is never echoed by the runner.
          sudo -n sed -i \
            -e '/^PLANPRICE_CATALOG_TOKEN=/d' \
            -e '/^PLANPRICE_SERVICE_ROLE=/d' \
            -e '/^EXCHANGE_RATE_API_KEY=/d' \
            "$env_file"
          printf 'PLANPRICE_CATALOG_TOKEN=%s\nPLANPRICE_SERVICE_ROLE=public\n' \
            "$PLANPRICE_CATALOG_TOKEN" | sudo -n tee -a "$env_file" >/dev/null
          sudo -n chown root:root "$env_file"
          sudo -n chmod 0600 "$env_file"

      - name: Validate runner access
        run: |
          set -euo pipefail
          test -d "$DEPLOY_PATH"
          sudo -n docker version --format '{{.Server.Version}}'
          sudo -n test -r "$DEPLOY_PATH/deploy/production/.env.production"

      - name: Create release archive
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/planprice-${GITHUB_SHA}.tar.gz" "$GITHUB_SHA"

      - name: Roll out release on devbox
        run: |
          set -euo pipefail

          base="$DEPLOY_PATH"
          release_dir="$base/.releases/$GITHUB_SHA"
          archive="$RUNNER_TEMP/planprice-$GITHUB_SHA.tar.gz"
          env_file="$base/deploy/production/.env.production"

          test -d "$base"
          sudo -n test -r "$env_file"
          sudo -n mkdir -p "$base/snapshots"
          sudo -n chmod 0750 "$base/snapshots"
          # The timer uses the same stable directory inode as its flock target.
          exec 9<"$base"
          flock -w 1800 9
          case "$release_dir" in
            "$base/.releases/"*) ;;
            *) echo "Unsafe release directory: $release_dir" >&2; exit 1 ;;
          esac
          sudo -n rm -rf "$release_dir"
          sudo -n mkdir -p "$release_dir"
          sudo -n tar -xzf "$archive" -C "$release_dir"
          sudo -n install -m 0600 "$env_file" "$release_dir/deploy/production/.env.production"
          sudo -n chown -R root:root "$release_dir"

          sudo -n env \
            DEPLOY_DIR="$release_dir" \
            COMPOSE_FILE="$release_dir/deploy/production/compose.yml" \
            ENV_FILE="$release_dir/deploy/production/.env.production" \
            DOCKER_CMD=/usr/bin/docker \
            LOCK_PATH="$base" \
            BUILD_SCRAPER=1 \
            "$release_dir/deploy/production/rollout.sh" "$GITHUB_SHA"

          sudo -n rsync -a \
            --exclude='deploy/production/.env.production' \
            "$release_dir/" "$base/"
          sudo -n chown root:root "$base/Dockerfile" "$base/deploy/production/rollout.sh" 2>/dev/null || true
          sudo -n install -m 0644 "$base/deploy/production/planprice-scraper.service" \
            /etc/systemd/system/planprice-scraper.service
          sudo -n install -m 0644 "$base/deploy/production/planprice-api-scraper.service" \
            /etc/systemd/system/planprice-api-scraper.service
          sudo -n install -m 0644 "$base/deploy/production/planprice-snapshot-cleanup.service" \
            /etc/systemd/system/planprice-snapshot-cleanup.service
          # Legacy OnFailure alert unit; alerts now come from the host-level
          # notify-failure@ drop-in (see CLAUDE.md). Remove the stale copy.
          sudo -n rm -f /etc/systemd/system/planprice-scraper-failure.service \
            "$base/deploy/production/planprice-scraper-failure.service" \
            "$base/deploy/production/notify-failure.sh"
          # Paused timers (masked, or marker in /etc/planprice/paused-timers/) are
          # left alone; see deploy/production/install-timers.sh.
          # Same rules as deploy/production/install-timers.sh, inlined so the
          # runner only needs the sudo commands it already had.
          active_timers=()
          for timer in planprice-scraper.timer planprice-api-scraper.timer planprice-snapshot-cleanup.timer; do
            state=$(sudo -n systemctl is-enabled "$timer" 2>/dev/null || true)
            if [[ "$state" == masked || "$state" == masked-runtime ]]; then
              echo "⏸️  $timer is masked; skipping install/enable/restart (paused by operator)"
              continue
            fi
            if [[ -e "/etc/planprice/paused-timers/$timer" ]]; then
              echo "⏸️  $timer has pause marker /etc/planprice/paused-timers/$timer; skipping install/enable/restart"
              continue
            fi
            sudo -n install -m 0644 "$base/deploy/production/$timer" "/etc/systemd/system/$timer"
            active_timers+=("$timer")
          done
          sudo -n systemctl daemon-reload
          if (( ${#active_timers[@]} )); then
            sudo -n systemctl enable "${active_timers[@]}"
            sudo -n systemctl restart "${active_timers[@]}"
          fi
          sudo -n docker compose -p planprice-production \
            -f "$base/deploy/production/compose.yml" \
            --env-file "$env_file" ps
          curl -fsSL --retry 3 --retry-delay 10 --retry-all-errors https://aiplans.dev/api/health

          # Release retention: keep the current release (rollback target) plus
          # the KEEP_RELEASES most recent others; prune only older ones.
          keep="${KEEP_RELEASES:-5}"
          sudo -n touch "$release_dir"
          echo "$GITHUB_SHA" | sudo -n tee "$base/.releases/CURRENT" >/dev/null
          sudo -n find "$base/.releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
            | sort -rn | cut -d' ' -f2- \
            | grep -vxF "$release_dir" \
            | tail -n +"$((keep + 1))" \
            | while IFS= read -r old; do
                case "$old" in
                  "$base/.releases/"?*) echo "prune release: $old"; sudo -n rm -rf -- "$old" ;;
                esac
              done
          echo "releases kept:"; sudo -n ls -1t "$base/.releases"

      # Disk hygiene even when rollout failed: consecutive failed deploys were
      # skipping prune (if: success) and drove x2v-global root 50%→85%. Prune
      # failure must not fail the job (continue-on-error). Each deploy rebuilds
      # app/migrate/scraper locally and leaves ~3–4G of build cache; the old
      # `--filter until=72h` kept all of it when deploys come hours apart
      # (45%→68% on 2026-10-17), so cap total cache at 5GB with no age filter.
      # Dangling image prune only — tagged :latest and :pre-rollout (exactly one
      # previous release) stay for rollback (rollout.sh).
      - name: Prune docker build cache
        if: always()
        continue-on-error: true
        run: |
          set +e
          echo "disk-hygiene: df before builder prune"
          df -h / || true
          sudo -n docker system df || true
          # Docker 28+ renamed --keep-storage to --max-used-space; try both.
          sudo -n docker builder prune -f --keep-storage 5GB \
            || sudo -n docker builder prune -f --max-used-space 5GB || true
          echo "disk-hygiene: df after builder prune"
          df -h / || true

      - name: Prune dangling docker images
        if: always()
        continue-on-error: true
        run: |
          set +e
          echo "disk-hygiene: dangling image prune (keeps tagged :latest / :pre-rollout)"
          sudo -n docker image prune -f || true
          echo "disk-hygiene: df after image prune"
          df -h / || true

      - name: Deployment summary
        if: always()
        run: |
          {
            echo '## Planprice production deployment'
            echo
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Target: \`$DEPLOY_PATH\`"
            echo "Health: https://aiplans.dev/api/health"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js for IndexNow
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Notify IndexNow
        run: |
          set -euo pipefail
          key='b1f0d17ebd1d1720cc80f2ede4b03770'
          test "$(curl -fsSL --retry 3 --retry-delay 10 --retry-all-errors "https://aiplans.dev/$key.txt")" = "$key"
          node --experimental-strip-types scripts/submit-indexnow.ts

      # Host one-shot (SRE-installed unit). Same hygiene as above; also covers
      # the case where inline prune was skipped or the unit does extra work.
      # Timer cadence stays SRE-owned; bump frequency there if still climbing.
      - name: Trigger planprice-disk-guard
        if: always()
        continue-on-error: true
        run: |
          set +e
          if sudo -n systemctl cat planprice-disk-guard.service >/dev/null 2>&1; then
            sudo -n systemctl start planprice-disk-guard.service || true
            sudo -n systemctl --no-pager --full status planprice-disk-guard.service || true
          else
            echo "planprice-disk-guard.service not installed; skip (SRE installs once)"
          fi
